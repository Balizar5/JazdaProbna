<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Krótka lista przygotowań do jazdy próbnej.">
  <title>Jazda Próbna</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="./">Jazda Próbna</a>
    <button id="theme-toggle" type="button" aria-pressed="false" hidden>Tryb ciemny</button>
  </header>
  <main>
    <section class="hero" aria-labelledby="title">
      <h1 id="title">Przygotuj się do jazdy próbnej</h1>
      <p>Sprawdź, jak samochód zachowuje się na drodze i czy dobrze się w nim czujesz.</p>
      <a class="action" href="#lista">Zobacz listę kontrolną</a>
    </section>
    <section class="checklist" id="lista" aria-labelledby="checklist-title">
      <h2 id="checklist-title">Co sprawdzić podczas jazdy?</h2>
      <ul>
        <li><label><input type="checkbox"> Ustaw fotel i lusterka. Sprawdź widoczność.</label></li>
        <li><label><input type="checkbox"> Zwróć uwagę na ruszanie, hamowanie i pracę kierownicy.</label></li>
        <li><label><input type="checkbox"> Spróbuj zaparkować i oceń, czy łatwo wyczuć gabaryty auta.</label></li>
      </ul>
    </section>
  </main>
</body>
</html>
